name = "our-memories-yearbook"
compatibility_date = "2026-11-19"
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "our-memories"
database_id = "00000000-0000-0000-0000-000000000001" # Replace with the D1 database ID before deploying.
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "our-memories-images" # Create this bucket before deploying.
